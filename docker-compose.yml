x-mesh-service: &mesh-service
  build:
    context: .
    dockerfile: mesh/Dockerfile
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/health"]
    interval: 5s
    timeout: 3s
    retries: 5
    start_period: 5s

services:
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs
      - nginx_access_logs:/var/log/nginx
    depends_on:
      fastify:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Edge log ingest (fleet-monitor-docs.md §12.2): tails nginx's JSON access
  # log from the shared volume and ships batches to POST /v1/nginx-logs.
  # Reuses the fastify image since the tailer has no deps beyond node core.
  nginx-log-tailer:
    build: ./server
    command: ["node", "nginx-log-tailer.js"]
    environment:
      INGEST_URL: http://fastify:3000
      ACCESS_LOG_PATH: /var/log/nginx/access.log
    volumes:
      - nginx_access_logs:/var/log/nginx:ro
    depends_on:
      fastify:
        condition: service_healthy
      nginx:
        condition: service_healthy

  fastify:
    build: ./server
    environment:
      PORT: 3000
      POSTGRES_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      INFLUXDB_URL: http://influxdb:8181
      INFLUXDB_DB: fleet_monitor
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Demo mesh (fleet-monitor-docs.md §3) — eight services built from
  # mesh/shared/service.js, parameterized by mesh/config.js. Host ports
  # match each service's `port` in that config, so chaos can be induced
  # directly (e.g. `curl -X POST localhost:4004/chaos -d '{"mode":"dead"}'`)
  # without going through nginx, which only proxies /api to fastify.
  session-store:
    <<: *mesh-service
    environment:
      SERVICE_NAME: session-store
      INGEST_URL: http://fastify:3000
    ports:
      - "4007:3000"

  ledger-db:
    <<: *mesh-service
    environment:
      SERVICE_NAME: ledger-db
      INGEST_URL: http://fastify:3000
    ports:
      - "4008:3000"

  auth-service:
    <<: *mesh-service
    environment:
      SERVICE_NAME: auth-service
      INGEST_URL: http://fastify:3000
    ports:
      - "4004:3000"
    depends_on:
      session-store:
        condition: service_healthy

  payments:
    <<: *mesh-service
    environment:
      SERVICE_NAME: payments
      INGEST_URL: http://fastify:3000
    ports:
      - "4005:3000"
    depends_on:
      ledger-db:
        condition: service_healthy

  inventory:
    <<: *mesh-service
    environment:
      SERVICE_NAME: inventory
      INGEST_URL: http://fastify:3000
    ports:
      - "4006:3000"
    depends_on:
      ledger-db:
        condition: service_healthy

  api-gateway:
    <<: *mesh-service
    environment:
      SERVICE_NAME: api-gateway
      INGEST_URL: http://fastify:3000
    ports:
      - "4003:3000"
    depends_on:
      auth-service:
        condition: service_healthy
      payments:
        condition: service_healthy
      inventory:
        condition: service_healthy

  web:
    <<: *mesh-service
    environment:
      SERVICE_NAME: web
      INGEST_URL: http://fastify:3000
    ports:
      - "4001:3000"
    depends_on:
      api-gateway:
        condition: service_healthy

  checkout:
    <<: *mesh-service
    environment:
      SERVICE_NAME: checkout
      INGEST_URL: http://fastify:3000
    ports:
      - "4002:3000"
    depends_on:
      api-gateway:
        condition: service_healthy

  traffic-generator:
    build:
      context: .
      dockerfile: mesh/Dockerfile
    command: ["node", "mesh/run-traffic-generator.js"]
    depends_on:
      web:
        condition: service_healthy
      checkout:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  influxdb:
    image: influxdb:3-core
    command:
      - influxdb3
      - serve
      - --node-id=fleet-monitor
      - --object-store=file
      - --data-dir=/var/lib/influxdb3
      - --without-auth
    ports:
      - "8181:8181"
    volumes:
      - influxdb_data:/var/lib/influxdb3
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8181/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-a", "bolt://localhost:7687", "-u", "neo4j", "-p", "${NEO4J_PASSWORD}", "RETURN 1;"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
  influxdb_data:
  neo4j_data:
  nginx_access_logs:
